<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IoT LightSwitch</title>
    
    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
        
    <!-- MQTT.js for WebSocket MQTT communication -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mqtt/4.3.7/mqtt.min.js"></script>
    
    <link rel="stylesheet" href="styles.css"></link>
</head>
<body>

    <div class="container text-center">
        <h2 class="mb-4">IoT Light Control</h2>

        <div class="mb-3">
            <button class="btn btn-success me-2" onclick="toggleLight('ON')">Turn ON</button>
            <button class="btn btn-danger" onclick="toggleLight('OFF')">Turn OFF</button>
        </div>

        <div class="mt-3">
            <label for="log">Sent Messages:</label>
            <textarea id="log" class="form-control" readonly></textarea>
        </div>
    </div>

    <script src="main.js"></script>

</body>
</html>
